    <text x="32" y="84" font-size="11" fill="#475569" text-anchor="middle">Awaiting choice</text>
  </g>
  <g transform="translate(300, 34)">
    <rect width="64" height="64" rx="6" fill="#eef2f7"/>
    <circle cx="22" cy="32" r="8.7" fill="#4ade80" stroke="#22c55e" stroke-width="3"/>
    <circle cx="42" cy="32" r="8.7" fill="#60a5fa" stroke="#3b82f6" stroke-width="3"/>
