name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pure-logic + browser-sandbox tests (run on plain node, any OS).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run plugin tests (pure core + browser-sandbox smoke)
        run: node test/core.test.mjs

  # The installers, exercised on REAL Linux (dash) and macOS (BSD userland)
  # against a profile shaped exactly like the one dsh ships: comment header +
  # bare `[]`, with no trailing newline — the case that used to produce an
  # invalid patch file.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Shell syntax check and line endings
        run: |
          set -euo pipefail
          sh -n install.sh                      # ubuntu's sh is dash; macOS's is bash --posix
          if grep -q $'\r' install.sh; then
            echo "install.sh contains CR characters (would break on Unix)"; exit 1
          fi
          chmod +x install.sh

      - name: Install YAML validator
        run: npm install --no-save --no-package-lock js-yaml

      - name: Install into a profile shaped like the shipped template
        run: |
          set -euo pipefail
          export DSH_HOME="$PWD/.ci-home"
          mkdir -p "$DSH_HOME/profiles/web"
          printf '# Your patch layer for this dsh profile, applied after every bundle layer:\n# a top-level YAML array of loader patch entries (id-targeted config\n# overrides, disables, and insert lists; `!!js` expressions allowed).\n[]' \
            > "$DSH_HOME/profiles/web/cordis.patch.yml"
          sh ./install.sh
          test -f "$DSH_HOME/profiles/web/node_modules/@pxy/dsh-tab-status-dot/lib/client.js"
          test -f "$DSH_HOME/profiles/web/node_modules/@pxy/dsh-tab-status-dot/package.json"
          node -e "
            const fs=require('fs'), y=require('js-yaml');
            const d=y.load(fs.readFileSync(process.env.DSH_HOME+'/profiles/web/cordis.patch.yml','utf8'));
            if(!Array.isArray(d)) throw new Error('patch file is not a top-level array');
            if(!JSON.stringify(d).includes('tab-status-dot')) throw new Error('row missing');
            console.log('patch entries after install:', d.length);
          "

      - name: Re-running is idempotent
        run: |
          set -euo pipefail
          export DSH_HOME="$PWD/.ci-home"
          out="$(sh ./install.sh)"
          case "$out" in
            *"already registered"*) echo "second run reported: already registered" ;;
            *) echo "second run was not idempotent:"; printf '%s\n' "$out"; exit 1 ;;
          esac

      - name: Appending to an existing patch list stays valid
        run: |
          set -euo pipefail
          export DSH_HOME="$PWD/.ci-home"
          sh ./install.sh --uninstall > /dev/null
          printf "# header comment\n- id: someone-else\n  name: 'other-pkg'\n" \
            > "$DSH_HOME/profiles/web/cordis.patch.yml"
          sh ./install.sh > /dev/null
          node -e "
            const fs=require('fs'), y=require('js-yaml');
            const d=y.load(fs.readFileSync(process.env.DSH_HOME+'/profiles/web/cordis.patch.yml','utf8'));
            if(!Array.isArray(d) || d.length !== 2) throw new Error('expected 2 entries, got '+JSON.stringify(d));
            console.log('patch entries after append:', d.length);
          "

      - name: Uninstall drops our row but keeps the other entries
        run: |
          set -euo pipefail
          export DSH_HOME="$PWD/.ci-home"
          sh ./install.sh --uninstall > /dev/null
          test ! -d "$DSH_HOME/profiles/web/node_modules/@pxy/dsh-tab-status-dot"
          node -e "
            const fs=require('fs'), y=require('js-yaml');
            const d=y.load(fs.readFileSync(process.env.DSH_HOME+'/profiles/web/cordis.patch.yml','utf8'));
            if(!Array.isArray(d) || d.length !== 1) throw new Error('expected the other entry to survive, got '+JSON.stringify(d));
            if(JSON.stringify(d).includes('tab-status-dot')) throw new Error('our row was not removed');
            console.log('patch entries after uninstall:', d.length);
          "

      - name: Uninstalling from the shipped template restores a valid empty list
        run: |
          set -euo pipefail
          export DSH_HOME="$PWD/.ci-home"
          printf '# Your patch layer for this dsh profile, applied after every bundle layer:\n# a top-level YAML array of loader patch entries (id-targeted config\n# overrides, disables, and insert lists; `!!js` expressions allowed).\n[]' \
            > "$DSH_HOME/profiles/web/cordis.patch.yml"
          sh ./install.sh > /dev/null
          sh ./install.sh --uninstall > /dev/null
          grep -q 'Your patch layer for this dsh profile' "$DSH_HOME/profiles/web/cordis.patch.yml"
          node -e "
            const fs=require('fs'), y=require('js-yaml');
            const d=y.load(fs.readFileSync(process.env.DSH_HOME+'/profiles/web/cordis.patch.yml','utf8'));
            if(!Array.isArray(d) || d.length !== 0) throw new Error('expected an empty array after uninstall, got '+JSON.stringify(d));
            console.log('patch entries after template uninstall:', d.length);
          "

  # The PowerShell installer, exercised on a real Windows runner.
  installers-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install YAML validator
        run: npm install --no-save --no-package-lock js-yaml

      - name: install.ps1 must parse under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('.\install.ps1')
          $bad = @($bytes | Where-Object { $_ -gt 127 })
          if ($bad.Count -gt 0) {
            throw "install.ps1 must stay ASCII-only (found $($bad.Count) non-ASCII bytes): Windows PowerShell 5.1 reads BOM-less scripts with the ANSI code page, so non-ASCII bytes behave differently per machine."
          }
          powershell -NoProfile -Command '$e=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1),[ref]$null,[ref]$e)|Out-Null; if($e){ $e | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 } else { "install.ps1 parses under Windows PowerShell 5.1" }'

      - name: Install into a profile shaped like the shipped template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home2 = Join-Path $PWD '.ci-home'
          New-Item -ItemType Directory -Force -Path (Join-Path $home2 'profiles\web') | Out-Null
          $template = "# Your patch layer for this dsh profile, applied after every bundle layer:`n# a top-level YAML array of loader patch entries (id-targeted config`n# overrides, disables, and insert lists; ``!!js`` expressions allowed).`n[]"
          [System.IO.File]::WriteAllText((Join-Path $home2 'profiles\web\cordis.patch.yml'), $template)
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -DshHome $home2
          $dest = Join-Path $home2 'profiles\web\node_modules\@pxy\dsh-tab-status-dot'
          if (-not (Test-Path (Join-Path $dest 'lib\client.js'))) { throw 'client.js was not installed' }
          if (-not (Test-Path (Join-Path $dest 'package.json'))) { throw 'package.json was not installed' }
          $env:DSH_HOME = $home2
          node -e "const fs=require('fs'),y=require('js-yaml');const d=y.load(fs.readFileSync(process.env.DSH_HOME+'/profiles/web/cordis.patch.yml','utf8'));if(!Array.isArray(d))throw new Error('not an array');if(!JSON.stringify(d).includes('tab-status-dot'))throw new Error('row missing');console.log('patch entries after install:',d.length)"

      - name: Re-running is idempotent, then uninstall restores the template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home2 = Join-Path $PWD '.ci-home'
          $env:DSH_HOME = $home2
          $out = powershell -ExecutionPolicy Bypass -File .\install.ps1 -DshHome $home2
          if (-not ($out -match 'already registered')) { throw 'second run was not idempotent' }
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -DshHome $home2 -Uninstall
          if (Test-Path (Join-Path $home2 'profiles\web\node_modules\@pxy\dsh-tab-status-dot')) { throw 'package directory survived uninstall' }
          node -e "const fs=require('fs'),y=require('js-yaml');const d=y.load(fs.readFileSync(process.env.DSH_HOME+'/profiles/web/cordis.patch.yml','utf8'));if(!Array.isArray(d)||d.length!==0)throw new Error('expected an empty array after uninstall, got '+JSON.stringify(d));console.log('patch entries after uninstall:',d.length)"

  # Third shell implementation: BusyBox `sh` (Alpine Linux), which is neither
  # dash nor bash --posix. Run through Docker so the checkout step still uses
  # the normal runner tooling.
  installers-alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh under BusyBox sh (Alpine container)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 \
            sh /w/.github/ci/alpine-installer-check.sh

  # The plugin's rendering behaviour, in a REAL browser: a fixture stands in for
  # the DSH kernel, and the assertions read the favicon the browser actually
  # resolves (neutral / light green / light blue / two dots) plus the untouched
  # page title.
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Browser E2E (favicon status dot)
        # Timing-sensitive by nature (rAF, 1 s dwell, hidden-tab paths), so a
        # slow runner can occasionally miss a wait. One retry keeps the board
        # honest: a real regression fails every attempt and still goes red.
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if node test/browser.e2e.mjs; then
              if [ "$attempt" != "1" ]; then echo "::warning::browser E2E passed only on attempt $attempt (flake)"; fi
              exit 0
            fi
            echo "attempt $attempt failed; retrying once…"
            sleep 5
          done
          echo "browser E2E failed on every attempt"; exit 1
